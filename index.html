<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Glass Mindmap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8eef7;user-select:none;touch-action:none}
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;will-change:transform;transition:transform .6s cubic-bezier(.22,1,.36,1)}
#world.no-transition{transition:none}
#links{position:absolute;left:-10000px;top:-10000px;width:20000px;height:20000px;pointer-events:none;overflow:visible}
#links path{fill:none;stroke:url(#linkGrad);stroke-width:1.5;opacity:.55;transition:opacity .8s ease,stroke-width .8s ease;filter:drop-shadow(0 0 6px rgba(180,210,255,.35))}
.node{position:absolute;width:78px;height:78px;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.45) 0%,rgba(255,255,255,.12) 25%,rgba(180,210,255,.08) 55%,rgba(120,160,220,.15) 80%,rgba(200,230,255,.25) 100%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);box-shadow:0 0 30px rgba(140,180,255,.25),inset 0 0 20px rgba(255,255,255,.15),inset -8px -10px 25px rgba(0,0,0,.35);cursor:grab;transition:transform 1s cubic-bezier(.22,1,.36,1),box-shadow .8s ease;will-change:transform}
.node.visible{transform:translate(-50%,-50%) scale(1)}
.node.dragging{cursor:grabbing;transition:none;box-shadow:0 0 50px rgba(180,220,255,.55),inset 0 0 25px rgba(255,255,255,.25),inset -8px -10px 25px rgba(0,0,0,.35)}
.node::before{content:"";position:absolute;top:8%;left:18%;width:35%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.7),rgba(255,255,255,0) 70%);filter:blur(2px);pointer-events:none}
.node::after{content:"";position:absolute;bottom:12%;right:15%;width:20%;height:15%;border-radius:50%;background:radial-gradient(ellipse,rgba(180,220,255,.4),rgba(180,220,255,0) 70%);filter:blur(3px);pointer-events:none}
.node .label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:500;color:rgba(255,255,255,.85);text-align:center;width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;text-shadow:0 0 8px rgba(140,180,255,.6)}
#sphere{position:fixed;left:50%;bottom:-180px;transform:translateX(-50%);width:360px;height:360px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5) 0%,rgba(255,255,255,.15) 20%,rgba(180,210,255,.1) 45%,rgba(120,160,220,.18) 70%,rgba(200,230,255,.3) 95%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);box-shadow:0 0 80px rgba(140,180,255,.35),inset 0 0 60px rgba(255,255,255,.2),inset -20px -30px 80px rgba(0,0,0,.5);pointer-events:none;z-index:5;transition:transform 1s cubic-bezier(.22,1,.36,1),opacity 1s ease}
#sphere::before{content:"";position:absolute;top:12%;left:20%;width:40%;height:25%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.8),rgba(255,255,255,0) 70%);filter:blur(4px)}
#sphere::after{content:"";position:absolute;bottom:18%;right:18%;width:25%;height:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(180,220,255,.5),rgba(180,220,255,0) 70%);filter:blur(5px)}
#sphere.pulling{transform:translateX(-50%) translateY(-40px) scale(1.05)}
#ghost{position:fixed;width:78px;height:78px;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.45) 0%,rgba(255,255,255,.12) 25%,rgba(180,210,255,.08) 55%,rgba(120,160,220,.15) 80%,rgba(200,230,255,.25) 100%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);box-shadow:0 0 30px rgba(140,180,255,.25),inset 0 0 20px rgba(255,255,255,.15),inset -8px -10px 25px rgba(0,0,0,.35);z-index:10;transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1)}
#ghost.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ghost::before{content:"";position:absolute;top:8%;left:18%;width:35%;height:22%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.7),rgba(255,255,255,0) 70%);filter:blur(2px)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:100}
#modal.open{opacity:1;pointer-events:auto}
#modal .card{width:min(420px,90vw);background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.15),rgba(180,210,255,.05) 60%,rgba(120,160,220,.08) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:28px;box-shadow:0 20px 80px rgba(140,180,255,.3),inset 0 0 40px rgba(255,255,255,.1);transform:scale(.85) translateY(30px);transition:transform .8s cubic-bezier(.22,1,.36,1);color:#e8eef7}
#modal.open .card{transform:scale(1) translateY(0)}
#modal .card h3{margin-bottom:18px;font-weight:500;font-size:18px;letter-spacing:.5px;text-shadow:0 0 12px rgba(180,220,255,.5)}
#modal .card label{display:block;font-size:12px;opacity:.7;margin:12px 0 6px;letter-spacing:.3px}
#modal .card input,#modal .card textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;color:#e8eef7;font-family:inherit;font-size:14px;outline:none;transition:border-color .4s ease,background .4s ease}
#modal .card input:focus,#modal .card textarea:focus{border-color:rgba(180,220,255,.5);background:rgba(255,255,255,.1)}
#modal .card textarea{min-height:80px;resize:vertical}
#modal .card .img-preview{width:100%;height:140px;border-radius:14px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.2);margin-top:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .4s ease}
#modal .card .img-preview img{max-width:100%;max-height:100%;object-fit:cover}
#modal .card .img-preview.empty{font-size:12px;opacity:.5}
#modal .card .actions{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
#modal .card button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#e8eef7;padding:9px 18px;border-radius:12px;cursor:pointer;font-size:13px;letter-spacing:.3px;transition:background .4s ease,transform .4s ease,box-shadow .4s ease}
#modal .card button:hover{background:rgba(255,255,255,.15);box-shadow:0 0 20px rgba(180,220,255,.3)}
#modal .card button.primary{background:linear-gradient(135deg,rgba(140,180,255,.3),rgba(180,220,255,.15));border-color:rgba(180,220,255,.4)}
#modal .card button.danger{color:#ffb4b4;border-color:rgba(255,150,150,.3)}
#hint{position:fixed;top:20px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.4;letter-spacing:.5px;pointer-events:none;z-index:20;transition:opacity 1.2s ease}
</style>
</head>
<body>
<div id="hint">свайп вверх от сферы • клик по шарику • долгое нажатие — настройки</div>
<div id="viewport">
<div id="world">
<svg id="links"><defs><linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="rgba(180,220,255,.6)"/><stop offset="50%" stop-color="rgba(220,240,255,.8)"/><stop offset="100%" stop-color="rgba(180,220,255,.6)"/></linearGradient></defs></svg>
</div>
</div>
<div id="sphere"></div>
<div id="ghost"></div>
<div id="modal">
<div class="card">
<h3>Настройки шарика</h3>
<label>Название</label>
<input id="f-name" type="text" placeholder="Идея...">
<label>Описание</label>
<textarea id="f-desc" placeholder="Детали..."></textarea>
<label>Картинка</label>
<input id="f-img" type="file" accept="image/*" style="display:none">
<div class="img-preview empty" id="img-preview">нажми чтобы выбрать</div>
<div class="actions">
<button class="danger" id="btn-delete">Удалить</button>
<button id="btn-cancel">Отмена</button>
<button class="primary" id="btn-save">Сохранить</button>
</div>
</div>
</div>
<script>
const viewport=document.getElementById('viewport'),world=document.getElementById('world'),linksSvg=document.getElementById('links'),sphere=document.getElementById('sphere'),ghost=document.getElementById('ghost'),modal=document.getElementById('modal'),fName=document.getElementById('f-name'),fDesc=document.getElementById('f-desc'),fImg=document.getElementById('f-img'),imgPreview=document.getElementById('img-preview'),btnSave=document.getElementById('btn-save'),btnCancel=document.getElementById('btn-cancel'),btnDelete=document.getElementById('btn-delete'),hint=document.getElementById('hint');
let panX=0,panY=0,scale=1,isPanning=false,lastX=0,lastY=0,nodes=[],nextId=1,editingNode=null,draggingNode=null,dragOffset={x:0,y:0},pullingFromSphere=false,pullStart=null,pullGhostNode=null,longPressTimer=null,longPressTarget=null;
function updateWorld(animate=true){if(!animate)world.classList.add('no-transition');else world.classList.remove('no-transition');world.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;if(!animate)requestAnimationFrame(()=>world.classList.remove('no-transition'));updateLinks()}
function screenToWorld(sx,sy){const r=viewport.getBoundingClientRect();return{x:(sx-r.left-r.width/2-panX)/scale,y:(sy-r.top-r.height/2-panY)/scale}}
function worldToScreen(wx,wy){const r=viewport.getBoundingClientRect();return{x:r.left+r.width/2+panX+wx*scale,y:r.top+r.height/2+panY+wy*scale}}
function updateLinks(){document.querySelectorAll('#links path').forEach(p=>p.remove());nodes.forEach(n=>{if(n.parent!==null){const p=nodes.find(x=>x.id===n.parent);if(p){const path=document.createElementNS('http://www.w3.org/2000/svg','path');const x1=p.x+10000,y1=p.y+10000,x2=n.x+10000,y2=n.y+10000;const mx=(x1+x2)/2,my=(y1+y2)/2;path.setAttribute('d',`M${x1} ${y1} Q${mx} ${y1} ${x2} ${y2}`);path.dataset.from=p.id;path.dataset.to=n.id;linksSvg.appendChild(path)}}})}
function createNode(x,y,parent=null,data={}){const id=nextId++;const node={id,x,y,parent,name:data.name||'',desc:data.desc||'',img:data.img||''};const el=document.createElement('div');el.className='node';el.style.left=(x+10000)+'px';el.style.top=(y+10000)+'px';el.dataset.id=id;const label=document.createElement('div');label.className='label';label.textContent=node.name||'•';el.appendChild(label);world.appendChild(el);node.el=el;nodes.push(node);requestAnimationFrame(()=>el.classList.add('visible'));updateLinks();return node}
function deleteNode(id){const node=nodes.find(n=>n.id===id);if(!node)return;node.el.classList.remove('visible');setTimeout(()=>{node.el.remove();nodes=nodes.filter(n=>n.id!==id);nodes.forEach(n=>{if(n.parent===id)n.parent=null});updateLinks()},1000)}
function updateNodeLabel(node){node.el.querySelector('.label').textContent=node.name||'•'}
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;if(e.target.closest('#sphere')||e.target.closest('#modal'))return;isPanning=true;viewport.classList.add('panning');lastX=e.clientX;lastY=e.clientY;world.classList.add('no-transition')});
window.addEventListener('pointermove',e=>{if(isPanning){panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;updateWorld(false)}if(pullingFromSphere&&pullGhostNode){const wxwy=screenToWorld(e.clientX,e.clientY);pullGhostNode.x=wxwy.x;pullGhostNode.y=wxwy.y;pullGhostNode.el.style.left=(wxwy.x+10000)+'px';pullGhostNode.el.style.top=(wxwy.y+10000)+'px';updateLinks()}if(draggingNode){const wxwy=screenToWorld(e.clientX-dragOffset.x,e.clientY-dragOffset.y);draggingNode.x=wxwy.x;draggingNode.y=wxwy.y;draggingNode.el.style.left=(wxwy.x+10000)+'px';draggingNode.el.style.top=(wxwy.y+10000)+'px';updateLinks()}});
window.addEventListener('pointerup',e=>{if(isPanning){isPanning=false;viewport.classList.remove('panning');world.classList.remove('no-transition')}if(pullingFromSphere){pullingFromSphere=false;sphere.classList.remove('pulling');ghost.classList.remove('visible');if(pullGhostNode){pullGhostNode.el.classList.add('visible')}pullGhostNode=null;pullStart=null}if(draggingNode){draggingNode.el.classList.remove('dragging');draggingNode=null}});
viewport.addEventListener('wheel',e=>{e.preventDefault();const delta=e.deltaY>0?0.9:1.1;const newScale=Math.max(0.2,Math.min(3,scale*delta));const r=viewport.getBoundingClientRect();const mx=e.clientX-r.left-r.width/2;const my=e.clientY-r.top-r.height/2;panX=mx-(mx-panX)*(newScale/scale);panY=my-(my-panY)*(newScale/scale);scale=newScale;updateWorld(false)},{passive:false});
let pinchDist=0,pinchScale=1;
viewport.addEventListener('touchstart',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;pinchDist=Math.hypot(dx,dy);pinchScale=scale}},{passive:true});
viewport.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.hypot(dx,dy);const newScale=Math.max(0.2,Math.min(3,pinchScale*(d/pinchDist)));const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;const cy=(e.touches[0].clientY+e.touches[1].clientY)/2;const r=viewport.getBoundingClientRect();const mx=cx-r.left-r.width/2;const my=cy-r.top-r.height/2;panX=mx-(mx-panX)*(newScale/scale);panY=my-(my-panY)*(newScale/scale);scale=newScale;updateWorld(false)}},{passive:false});
sphere.addEventListener('pointerdown',e=>{e.preventDefault();pullingFromSphere=true;pullStart={x:e.clientX,y:e.clientY};sphere.classList.add('pulling');const sphereRect=sphere.getBoundingClientRect();const sx=sphereRect.left+sphereRect.width/2;const sy=sphereRect.top+sphereRect.height/2;ghost.style.left=sx+'px';ghost.style.top=sy+'px';ghost.classList.add('visible');const w=screenToWorld(sx,sy);pullGhostNode=createNode(w.x,w.y,null);pullGhostNode.el.classList.remove('visible');pullGhostNode.el.style.transform='translate(-50%,-50%) scale(0.3)';setTimeout(()=>{if(pullGhostNode)pullGhostNode.el.style.transform=''},50)});
window.addEventListener('pointermove',e=>{if(pullingFromSphere){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}});
window.addEventListener('pointerup',e=>{if(pullingFromSphere&&pullGhostNode){const dist=Math.hypot(e.clientX-pullStart.x,e.clientY-pullStart.y);if(dist<30){deleteNode(pullGhostNode.id);pullGhostNode=null}else{pullGhostNode.el.style.transform=''}}});
world.addEventListener('pointerdown',e=>{const nodeEl=e.target.closest('.node');if(!nodeEl)return;e.stopPropagation();const id=+nodeEl.dataset.id;const node=nodes.find(n=>n.id===id);if(!node)return;longPressTarget=node;longPressTimer=setTimeout(()=>{openModal(node);longPressTarget=null},600);const start={x:e.clientX,y:e.clientY};const moveHandler=ev=>{if(longPressTarget===null)return;const d=Math.hypot(ev.clientX-start.x,ev.clientY-start.y);if(d>8){clearTimeout(longPressTimer);longPressTimer=null;draggingNode=node;node.el.classList.add('dragging');const r=viewport.getBoundingClientRect();const nodeScreen=worldToScreen(node.x,node.y);dragOffset.x=ev.clientX-nodeScreen.x;dragOffset.y=ev.clientY-nodeScreen.y}};const upHandler=()=>{clearTimeout(longPressTimer);longPressTimer=null;if(!draggingNode&&longPressTarget===node){const parent=nodes.find(n=>n.id===node.parent);const angle=Math.random()*Math.PI*2;const dist=140;const nx=node.x+Math.cos(angle)*dist;const ny=node.y+Math.sin(angle)*dist;createNode(nx,ny,node.id)}longPressTarget=null;window.removeEventListener('pointermove',moveHandler);window.removeEventListener('pointerup',upHandler)};window.addEventListener('pointermove',moveHandler);window.addEventListener('pointerup',upHandler)});
function openModal(node){editingNode=node;fName.value=node.name;fDesc.value=node.desc;if(node.img){imgPreview.innerHTML=`<img src="${node.img}">`;imgPreview.classList.remove('empty')}else{imgPreview.innerHTML='нажми чтобы выбрать';imgPreview.classList.add('empty')}modal.classList.add('open')}
function closeModal(){modal.classList.remove('open');editingNode=null}
btnCancel.addEventListener('click',closeModal);
btnSave.addEventListener('click',()=>{if(editingNode){editingNode.name=fName.value;editingNode.desc=fDesc.value;updateNodeLabel(editingNode)}closeModal()});
btnDelete.addEventListener('click',()=>{if(editingNode){deleteNode(editingNode.id);closeModal()}});
imgPreview.addEventListener('click',()=>fImg.click());
fImg.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{if(editingNode){editingNode.img=ev.target.result;imgPreview.innerHTML=`<img src="${ev.target.result}">`;imgPreview.classList.remove('empty')}};r.readAsDataURL(f)});
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
setTimeout(()=>hint.style.opacity='0',5000);
updateWorld(false);
</script>
</body>
</html>
