<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MindMap Sphere</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e27;
            touch-action: none;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #nodes-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .sphere {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00d4ff, #7b2ff7, #ff006e);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.6),
                        inset 0 0 40px rgba(255, 255, 255, 0.3);
            animation: spherePulse 3s ease-in-out infinite, sphereRotate 8s linear infinite;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .sphere:active {
            transform: translateX(-50%) scale(0.95);
        }

        .sphere::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), transparent);
            animation: sphereShine 4s ease-in-out infinite;
        }

        @keyframes spherePulse {
            0%, 100% {
                box-shadow: 0 0 60px rgba(0, 212, 255, 0.6),
                            inset 0 0 40px rgba(255, 255, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 80px rgba(123, 47, 247, 0.8),
                            inset 0 0 50px rgba(255, 255, 255, 0.4);
            }
        }

        @keyframes sphereRotate {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        @keyframes sphereShine {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .node {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00d4ff, #7b2ff7);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5),
                        inset 0 0 20px rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease;
            will-change: transform;
        }

        .node:hover {
            box-shadow: 0 0 40px rgba(123, 47, 247, 0.7),
                        inset 0 0 25px rgba(255, 255, 255, 0.3);
        }

        .node:active {
            transform: scale(0.9);
        }

        .node::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), transparent);
        }

        .node-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 300px;
            background: rgba(20, 25, 50, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
            z-index: 100;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.3s ease;
        }

        .node-card.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .node-card input,
        .node-card textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 14px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .node-card input:focus,
        .node-card textarea:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.8);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .node-card textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .node-card button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .node-card button:active {
            transform: translateY(0);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.8), rgba(123, 47, 247, 0.8));
            transform-origin: 0 50%;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="background"></canvas>
    <canvas id="canvas"></canvas>
    <div id="nodes-container"></div>
    
    <div class="sphere" id="sphere"></div>
    
    <div class="overlay" id="overlay"></div>
    <div class="node-card" id="nodeCard">
        <input type="text" id="nodeTitle" placeholder="Название">
        <textarea id="nodeDescription" placeholder="Описание"></textarea>
        <button id="saveNode">Сохранить</button>
    </div>

    <script>
        // Background stars
        const bgCanvas = document.getElementById('background');
        const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;

        const stars = [];
        const starCount = 200;

        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                radius: Math.random() * 1.5,
                opacity: Math.random(),
                speed: Math.random() * 0.5 + 0.1
            });
        }

        function drawStars() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            stars.forEach(star => {
                bgCtx.beginPath();
                bgCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                bgCtx.fill();
                
                star.opacity += star.speed * 0.01;
                if (star.opacity > 1 || star.opacity < 0) {
                    star.speed = -star.speed;
                }
            });
            
            requestAnimationFrame(drawStars);
        }

        drawStars();

        // Main canvas for lines
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Nodes management
        const nodesContainer = document.getElementById('nodes-container');
        const sphere = document.getElementById('sphere');
        const overlay = document.getElementById('overlay');
        const nodeCard = document.getElementById('nodeCard');
        const nodeTitle = document.getElementById('nodeTitle');
        const nodeDescription = document.getElementById('nodeDescription');
        const saveNodeBtn = document.getElementById('saveNode');

        let nodes = [];
        let connections = [];
        let currentNode = null;
        let isDragging = false;
        let dragStartY = 0;
        let longPressTimer = null;

        // Sphere interaction
        sphere.addEventListener('touchstart', handleSphereTouchStart);
        sphere.addEventListener('touchend', handleSphereTouchEnd);
        sphere.addEventListener('mousedown', handleSphereMouseDown);
        sphere.addEventListener('mouseup', handleSphereMouseUp);

        function handleSphereTouchStart(e) {
            e.preventDefault();
            isDragging = true;
            dragStartY = e.touches[0].clientY;
        }

        function handleSphereTouchEnd(e) {
            if (isDragging) {
                const endY = e.changedTouches[0].clientY;
                const distance = dragStartY - endY;
                
                if (distance > 50) {
                    createNodeFromSphere();
                }
                isDragging = false;
            }
        }

        function handleSphereMouseDown(e) {
            isDragging = true;
            dragStartY = e.clientY;
        }

        function handleSphereMouseUp(e) {
            if (isDragging) {
                const distance = dragStartY - e.clientY;
                
                if (distance > 50) {
                    createNodeFromSphere();
                }
                isDragging = false;
            }
        }

        function createNodeFromSphere() {
            const sphereRect = sphere.getBoundingClientRect();
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            const node = document.createElement('div');
            node.className = 'node';
            node.style.left = sphereRect.left + sphereRect.width / 2 - 30 + 'px';
            node.style.top = sphereRect.top + 'px';
            node.style.transform = 'scale(0)';
            
            nodesContainer.appendChild(node);

            const nodeData = {
                element: node,
                x: centerX,
                y: centerY,
                title: '',
                description: ''
            };
            nodes.push(nodeData);

            // Animate to center
            requestAnimationFrame(() => {
                node.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                node.style.left = centerX - 30 + 'px';
                node.style.top = centerY - 30 + 'px';
                node.style.transform = 'scale(1)';
            });

            setupNodeInteraction(node, nodeData);
        }

        function setupNodeInteraction(node, nodeData) {
            let pressTimer = null;
            let isLongPress = false;

            const startPress = (e) => {
                e.preventDefault();
                isLongPress = false;
                
                pressTimer = setTimeout(() => {
                    isLongPress = true;
                    openNodeCard(nodeData);
                }, 500);
            };

            const endPress = (e) => {
                clearTimeout(pressTimer);
                
                if (!isLongPress) {
                    createConnectedNode(nodeData);
                }
            };

            node.addEventListener('touchstart', startPress);
            node.addEventListener('touchend', endPress);
            node.addEventListener('mousedown', startPress);
            node.addEventListener('mouseup', endPress);
        }

        function createConnectedNode(parentNode) {
            const angle = Math.random() * Math.PI * 2;
            const distance = 150;
            const targetX = parentNode.x + Math.cos(angle) * distance;
            const targetY = parentNode.y + Math.sin(angle) * distance;

            const node = document.createElement('div');
            node.className = 'node';
            node.style.left = parentNode.x - 30 + 'px';
            node.style.top = parentNode.y - 30 + 'px';
            node.style.transform = 'scale(0)';
            
            nodesContainer.appendChild(node);

            const nodeData = {
                element: node,
                x: targetX,
                y: targetY,
                title: '',
                description: '',
                parent: parentNode
            };
            nodes.push(nodeData);

            // Create connection line
            const connection = {
                from: parentNode,
                to: nodeData
            };
            connections.push(connection);

            // Animate to position
            requestAnimationFrame(() => {
                node.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                node.style.left = targetX - 30 + 'px';
                node.style.top = targetY - 30 + 'px';
                node.style.transform = 'scale(1)';
            });

            setupNodeInteraction(node, nodeData);
            drawConnections();
        }

        function drawConnections() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            connections.forEach(conn => {
                const fromX = conn.from.x;
                const fromY = conn.from.y;
                const toX = conn.to.x;
                const toY = conn.to.y;

                const gradient = ctx.createLinearGradient(fromX, fromY, toX, toY);
                gradient.addColorStop(0, 'rgba(0, 212, 255, 0.8)');
                gradient.addColorStop(1, 'rgba(123, 47, 247, 0.8)');

                ctx.beginPath();
                ctx.moveTo(fromX, fromY);
                ctx.lineTo(toX, toY);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0, 212, 255, 0.5)';
                ctx.stroke();
            });
        }

        function openNodeCard(nodeData) {
            currentNode = nodeData;
            nodeTitle.value = nodeData.title;
            nodeDescription.value = nodeData.description;
            
            overlay.classList.add('active');
            nodeCard.classList.add('active');
        }

        function closeNodeCard() {
            overlay.classList.remove('active');
            nodeCard.classList.remove('active');
            currentNode = null;
        }

        saveNodeBtn.addEventListener('click', () => {
            if (currentNode) {
                currentNode.title = nodeTitle.value;
                currentNode.description = nodeDescription.value;
                closeNodeCard();
            }
        });

        overlay.addEventListener('click', closeNodeCard);

        // Handle window resize
        window.addEventListener('resize', () => {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawConnections();
        });

        // Continuous connection redraw for smooth animations
        function animateConnections() {
            drawConnections();
            requestAnimationFrame(animateConnections);
        }
        animateConnections();
    </script>
</body>
</html>
